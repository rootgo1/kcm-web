services:
  - type: web
    name: kcm
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 22.23.3
      - key: NODE_ENV
        value: production
      - key: RETELL_AGENT_ID
        value: agent_0cf2b1f09a8e52e6d2abc45b71
      - key: RETELL_API_KEY
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: KCM_DEMO_CUSTOMER_ID
        sync: false
      - key: KCM_DEMO_STORE_ID
        sync: false
